<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TypeRacer</title>
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Courier New', monospace; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { font-size: 2.5rem; color: #00ff88; letter-spacing: 4px; margin-bottom: 2rem; text-transform: uppercase; }
    .screen { display: none; width: 100%; max-width: 600px; padding: 2rem; }
    .screen.active { display: block; }
    input { width: 100%; padding: 12px 16px; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: none; border-color: #00ff88; }
    button { width: 100%; padding: 12px; background: #00ff88; border: none; border-radius: 6px; color: #0f0f0f; font-family: 'Courier New', monospace; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 0.75rem; transition: opacity 0.2s; }
    button:hover { opacity: 0.85; }
    button.secondary { background: transparent; border: 1px solid #00ff88; color: #00ff88; }
    .error { color: #ff4444; font-size: 0.875rem; margin-bottom: 1rem; }
    .code-display { font-size: 2rem; letter-spacing: 8px; color: #00ff88; text-align: center; padding: 1.5rem; background: #1a1a1a; border-radius: 8px; margin: 1rem 0; }
    .players-list { background: #1a1a1a; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .player-item { padding: 8px 0; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; }
    .player-item:last-child { border-bottom: none; }
    .ready-badge { color: #00ff88; font-size: 0.75rem; }
    .text-display { background: #1a1a1a; border-radius: 8px; padding: 1.5rem; margin: 1rem 0; font-size: 1.1rem; line-height: 1.8; letter-spacing: 1px; }
    .char-correct { color: #00ff88; }
    .char-incorrect { color: #ff4444; background: #2a0000; }
    .char-pending { color: #555; }
    .char-current { border-bottom: 2px solid #00ff88; }
    #typing-input { margin-top: 1rem; font-size: 1rem; }
    .progress-bars { margin: 1rem 0; }
    .progress-row { margin-bottom: 0.75rem; }
    .progress-label { font-size: 0.875rem; color: #888; margin-bottom: 4px; }
    .progress-bar-bg { background: #1a1a1a; border-radius: 99px; height: 8px; }
    .progress-bar-fill { background: #00ff88; height: 8px; border-radius: 99px; transition: width 0.3s; }
    .result-box { text-align: center; padding: 2rem; background: #1a1a1a; border-radius: 8px; margin: 1rem 0; }
    .result-winner { font-size: 1.5rem; color: #00ff88; margin-bottom: 0.5rem; }
    .status-msg { color: #888; font-size: 0.875rem; text-align: center; margin: 0.5rem 0; }
    .tab-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tab { flex: 1; padding: 10px; background: transparent; border: 1px solid #333; color: #888; cursor: pointer; border-radius: 6px; }
    .tab.active { border-color: #00ff88; color: #00ff88; }
  </style>
</head>
<body>

<h1>TypeRacer</h1>

<!-- AUTH SCREEN -->
<div class="screen active" id="screen-auth">
  <div class="tab-row">
    <button class="tab active" onclick="switchTab('login')">Login</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>
  <div id="auth-error" class="error"></div>
  <input type="text" id="auth-username" placeholder="Username">
  <input type="password" id="auth-password" placeholder="Password">
  <input type="email" id="auth-email" placeholder="Email" style="display:none">
  <button onclick="submitAuth()">Enter</button>
</div>

<!-- LOBBY SCREEN -->
<div class="screen" id="screen-lobby">
  <p class="status-msg" id="lobby-welcome"></p>
  <button onclick="createRoom()">Create Room</button>
  <div style="display:flex;gap:0.5rem">
    <input type="text" id="join-code" placeholder="Room code" style="margin:0">
    <button onclick="joinRoom()" style="width:auto;padding:12px 20px;margin:0">Join</button>
  </div>
  <div id="lobby-error" class="error" style="margin-top:0.5rem"></div>
</div>

<!-- ROOM SCREEN -->
<div class="screen" id="screen-room">
  <p class="status-msg">Room Code:</p>
  <div class="code-display" id="room-code-display"></div>
  <p class="status-msg">Players (<span id="player-count">0</span>/4)</p>
  <div class="players-list" id="players-list"></div>
  <p class="status-msg" id="room-status-msg">Waiting for players...</p>
  <button onclick="setReady()" id="ready-btn">Ready</button>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="screen-game">
  <div class="text-display" id="text-display"></div>
  <input type="text" id="typing-input" placeholder="Start typing..." oninput="onType()" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <div class="progress-bars" id="progress-bars"></div>
</div>

<!-- RESULT SCREEN -->
<div class="screen" id="screen-result">
  <div class="result-box">
    <div class="result-winner" id="result-winner"></div>
    <p class="status-msg" id="result-msg"></p>
  </div>
  <button onclick="backToLobby()">Back to Lobby</button>
</div>

<script>
let token = null;
let username = null;
let roomCode = null;
let stompClient = null;
let gameText = '';
let typedIndex = 0;
let isAuthMode = 'login';
let playerProgresses = {};

function switchTab(mode) {
  isAuthMode = mode;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0) === (mode==='login')));
  document.getElementById('auth-email').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('auth-error').textContent = '';
}

async function submitAuth() {
  const u = document.getElementById('auth-username').value.trim();
  const p = document.getElementById('auth-password').value.trim();
  const e = document.getElementById('auth-email').value.trim();
  if (!u || !p) return;

  const url = isAuthMode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
  const body = isAuthMode === 'login' ? { username: u, password: p } : { username: u, password: p, email: e };

  try {
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const text = await res.text();
    if (!res.ok) { document.getElementById('auth-error').textContent = text; return; }
    if (isAuthMode === 'register') { switchTab('login'); document.getElementById('auth-error').style.color='#00ff88'; document.getElementById('auth-error').textContent = 'Registered! Please login.'; return; }
    token = text;
    username = u;
    document.getElementById('lobby-welcome').textContent = 'Welcome, ' + username;
    showScreen('lobby');
    connectWebSocket();
  } catch(err) { document.getElementById('auth-error').textContent = 'Connection error'; }
}

function connectWebSocket() {
  const socket = new SockJS('/ws');
  stompClient = Stomp.over(socket);
  stompClient.debug = null;
  stompClient.connect({ 'Authorization': 'Bearer ' + token }, () => {
    console.log('WebSocket connected');
  }, (err) => { console.error('WS error', err); });
}

async function createRoom() {
  try {
    const res = await fetch('/api/v1/room/create', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) { document.getElementById('lobby-error').textContent = 'Failed to create room'; return; }
    const room = await res.json();
    enterRoom(room);
  } catch(err) { document.getElementById('lobby-error').textContent = 'Connection error'; }
}

async function joinRoom() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (!code) return;
  try {
    const res = await fetch('/api/v1/room/join/' + code, { method: 'POST', headers: { 'Authorization': 'Bearer ' + token } });
    if (!res.ok) { document.getElementById('lobby-error').textContent = 'Room not found or full'; return; }
    const room = await res.json();
    enterRoom(room);
  } catch(err) { document.getElementById('lobby-error').textContent = 'Connection error'; }
}

function enterRoom(room) {
  roomCode = room.code;
  document.getElementById('room-code-display').textContent = roomCode;
  updatePlayersList(room.players);
  showScreen('room');
  subscribeToRoom();
}

function subscribeToRoom() {
  stompClient.subscribe('/topic/room.' + roomCode, (msg) => {
    const body = msg.body;
    try {
      const data = JSON.parse(body);
      if (data.event === 'game.start' || data.text) { startGame(data.text); return; }
      if (data.username && data.progress !== undefined) { updateProgress(data.username, data.progress); return; }
    } catch(e) {}
    if (typeof body === 'string') {
      if (body.startsWith('game.end:')) { showResult(body.replace('game.end:', '') + ' wins!'); }
      else if (body.startsWith('player.disconnected:')) { document.getElementById('room-status-msg').textContent = body.replace('player.disconnected:', '') + ' disconnected'; }
    }
  });
}

function updatePlayersList(players) {
  document.getElementById('player-count').textContent = players.length;
  document.getElementById('players-list').innerHTML = players.map(p =>
    '<div class="player-item"><span>' + p + '</span></div>'
  ).join('');
  playerProgresses = {};
  players.forEach(p => playerProgresses[p] = 0);
}

function setReady() {
  document.getElementById('ready-btn').textContent = 'Waiting...';
  document.getElementById('ready-btn').disabled = true;
  stompClient.send('/app/game.ready', {}, JSON.stringify({ roomCode: roomCode, username: username }));
}

function startGame(text) {
  gameText = text;
  typedIndex = 0;
  renderText();
  updateProgressBars();
  showScreen('game');
  document.getElementById('typing-input').value = '';
  document.getElementById('typing-input').focus();
}

function renderText() {
  const typed = document.getElementById('typing-input').value;
  let html = '';
  for (let i = 0; i < gameText.length; i++) {
    const ch = gameText[i] === ' ' ? '&nbsp;' : gameText[i];
    if (i < typed.length) {
      html += '<span class="' + (typed[i] === gameText[i] ? 'char-correct' : 'char-incorrect') + '">' + ch + '</span>';
    } else if (i === typed.length) {
      html += '<span class="char-current char-pending">' + ch + '</span>';
    } else {
      html += '<span class="char-pending">' + ch + '</span>';
    }
  }
  document.getElementById('text-display').innerHTML = html;
}

function onType() {
  renderText();
  const typed = document.getElementById('typing-input').value;
  stompClient.send('/app/player.progress', {}, JSON.stringify({ roomCode: roomCode, username: username, typedText: typed }));
}

function updateProgress(user, progress) {
  playerProgresses[user] = progress;
  updateProgressBars();
}

function updateProgressBars() {
  const html = Object.entries(playerProgresses).map(([u, p]) =>
    '<div class="progress-row"><div class="progress-label">' + u + ' — ' + p + '%</div><div class="progress-bar-bg"><div class="progress-bar-fill" style="width:' + p + '%"></div></div></div>'
  ).join('');
  document.getElementById('progress-bars').innerHTML = html;
}

function showResult(msg) {
  document.getElementById('result-winner').textContent = msg;
  document.getElementById('result-msg').textContent = 'Game over';
  showScreen('result');
}

function backToLobby() {
  roomCode = null;
  document.getElementById('ready-btn').textContent = 'Ready';
  document.getElementById('ready-btn').disabled = false;
  showScreen('lobby');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}
</script>
</body>
</html>
